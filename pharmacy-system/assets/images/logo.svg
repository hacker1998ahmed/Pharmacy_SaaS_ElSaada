<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338CA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- الخلفية -->
  <rect width="400" height="150" rx="15" fill="#f8fafc"/>
  
  <!-- الأيقونة -->
  <g transform="translate(20, 25)">
    <rect width="100" height="100" rx="20" fill="url(#logoGrad)"/>
    <path d="M50 25 L50 75 M30 45 L70 45" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="35" stroke="white" stroke-width="2" fill="none" opacity="0.2"/>
  </g>
  
  <!-- النص -->
  <text x="140" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">صيدلية الشفاء</text>
  <text x="140" y="100" font-family="Arial, sans-serif" font-size="14" fill="#64748b">نظام إدارة متكامل</text>
  
  <!-- زخرفة -->
  <circle cx="370" cy="30" r="8" fill="#4F46E5" opacity="0.3"/>
  <circle cx="350" cy="120" r="5" fill="#10B981" opacity="0.3"/>
  <circle cx="380" cy="100" r="6" fill="#F59E0B" opacity="0.3"/>
</svg>
